name: atlas-ci

# Phase 1 (lineage half): bring up Atlas, register a lineage graph, and assert
# the edge  events_source -> seed_lakehouse -> iceberg.smoke.events  is queryable.
# Atlas (embedded HBase + Solr) is heavy and slow, so this runs on its own.

on:
  push:
    branches: [main]
    paths:
      - "platform/governance/atlas/**"
      - "quickstart/spark/jobs/**"
      - "quickstart/docker-compose.yml"
      - "quickstart/docker-compose.governance.yml"
      - ".github/workflows/atlas-ci.yml"
  pull_request:
    paths:
      - "platform/governance/atlas/**"
      - "quickstart/spark/jobs/**"
      - "quickstart/docker-compose.yml"
      - "quickstart/docker-compose.governance.yml"
      - ".github/workflows/atlas-ci.yml"
  workflow_dispatch:

jobs:
  lineage-proof:
    runs-on: ubuntu-latest
    # Cap the job so a Docker Hub pull stall fails fast, never the 6h default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: quickstart

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      # Atlas (embedded HBase + Solr) is memory-hungry — boot it alone.
      - name: Start Atlas
        run: |
          for i in 1 2 3; do if docker compose -f docker-compose.yml -f docker-compose.governance.yml up -d atlas; then break; fi; if [ "$i" = 3 ]; then echo "compose up still failing after $i attempts"; exit 1; fi; echo "compose up failed (attempt $i; likely a Docker Hub pull flake); retrying in 15s ..."; sleep 15; done

      - name: Wait for Atlas REST (up to ~15 min)
        run: |
          for i in $(seq 1 90); do
            if curl -sf -u admin:admin http://localhost:21000/api/atlas/admin/version >/dev/null; then
              echo "Atlas is up"; exit 0
            fi
            echo "waiting for Atlas ($i)..."; sleep 10
          done
          echo "Atlas did not become ready in time"; exit 1

      # Gating proof: the entity/graph model, posted via REST (lightweight).
      - name: Register and verify lineage (entity model)
        run: bash ../platform/governance/atlas/register-lineage.sh

      # Best-effort: the *automatic* path — a Spark transform with the OpenLineage
      # listener, bridged into Atlas. Needs Spark + iceberg-rest + minio on top of
      # Atlas, which is tight on a 7 GB runner, so a resource-starve here doesn't
      # block the PR. It's validated locally (OpenLineage capture + the bridge).
      - name: Start Spark (+ iceberg-rest + minio)
        continue-on-error: true
        run: |
          for i in 1 2 3; do if docker compose -f docker-compose.yml -f docker-compose.governance.yml up -d spark; then break; fi; if [ "$i" = 3 ]; then echo "compose up still failing after $i attempts"; exit 1; fi; echo "compose up failed (attempt $i; likely a Docker Hub pull flake); retrying in 15s ..."; sleep 15; done

      - name: Automatic lineage — capture from Spark (OpenLineage) into Atlas
        continue-on-error: true
        run: |
          for i in $(seq 1 40); do
            docker compose exec -T spark ls /opt/spark/bin/spark-submit >/dev/null 2>&1 && break
            echo "waiting for Spark ($i)..."; sleep 5
          done
          bash ../platform/governance/atlas/register-lineage-auto.sh

      - name: Dump Atlas logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.governance.yml logs --no-color atlas

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.governance.yml down -v
