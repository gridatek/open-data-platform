name: console-ci

# Phase 2: build + test the read-only console (Spring Boot API and Angular web).

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/console-ci.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console-ci.yml"
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test the API
        run: mvn -B -ntp test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build the web app
        run: npm run build
