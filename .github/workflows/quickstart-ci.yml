name: quickstart-ci

# Phase 0 smoke test: bring up the lakehouse core and prove that the
# Iceberg REST catalog + MinIO + Trino path actually works end to end.

on:
  push:
    branches: [main]
    paths:
      - "quickstart/**"
      - ".github/workflows/quickstart-ci.yml"
  pull_request:
    paths:
      - "quickstart/**"
      - ".github/workflows/quickstart-ci.yml"
  workflow_dispatch:

jobs:
  lakehouse-smoke:
    runs-on: ubuntu-latest
    # Cap the job so a Docker Hub pull stall fails fast, never the 6h default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: quickstart

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config

      - name: Start the stack
        run: |
          for i in 1 2 3; do if docker compose up -d; then break; fi; if [ "$i" = 3 ]; then echo "compose up still failing after $i attempts"; exit 1; fi; echo "compose up failed (attempt $i; likely a Docker Hub pull flake); retrying in 15s ..."; sleep 15; done

      - name: Wait for the Iceberg REST catalog
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8181/v1/config >/dev/null; then
              echo "REST catalog is up"; exit 0
            fi
            echo "waiting for REST catalog ($i)..."; sleep 5
          done
          echo "REST catalog did not become ready in time"; exit 1

      - name: Wait for Trino to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v1/info >/dev/null; then
              echo "Trino is up"; exit 0
            fi
            echo "waiting for Trino ($i)..."; sleep 5
          done
          echo "Trino did not become ready in time"; exit 1

      - name: Write the demo table from Spark
        run: docker compose exec -T spark spark-submit /home/iceberg/jobs/seed_lakehouse.py

      - name: Read it back from Trino and assert 4 rows
        run: |
          COUNT=$(docker compose exec -T trino trino --execute \
            "SELECT count(*) FROM iceberg.smoke.events;" | tr -d '"[:space:]')
          echo "row count = $COUNT"
          test "$COUNT" = "4"

      - name: Iceberg maintenance (compaction + snapshot expiry)
        run: |
          docker compose exec -T spark spark-submit /home/iceberg/jobs/maintain_lakehouse.py
          # data must still be there + queryable after maintenance
          COUNT=$(docker compose exec -T trino trino --execute \
            "SELECT count(*) FROM iceberg.smoke.events;" | tr -d '"[:space:]')
          echo "row count after maintenance = $COUNT"
          test "$COUNT" = "4"

      - name: Iceberg features (partitioning, MERGE upserts, schema evolution, time-travel)
        run: bash ../platform/engineering/iceberg-features.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
