name: services-ci

# Phase 3: prove the breadth services work against the governed lakehouse.
#  - Superset: runs a SQL Lab query through Trino against iceberg.smoke.events
#  - Airflow:  the example DAG parses and is listed

on:
  push:
    branches: [main]
    paths:
      - "quickstart/docker-compose.services.yml"
      - "platform/viz/**"
      - "platform/engineering/**"
      - "platform/ml/**"
      - "platform/flow/**"
      - ".github/workflows/services-ci.yml"
  pull_request:
    paths:
      - "quickstart/docker-compose.services.yml"
      - "platform/viz/**"
      - "platform/engineering/**"
      - "platform/ml/**"
      - "platform/flow/**"
      - ".github/workflows/services-ci.yml"
  workflow_dispatch:

jobs:
  superset-query:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickstart
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env

      - name: Start lakehouse + Superset (and Spark to seed)
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml up -d --build superset spark

      - name: Wait for the Iceberg REST catalog
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8181/v1/config >/dev/null && exit 0
            echo "waiting for REST ($i)..."; sleep 5
          done; exit 1

      - name: Wait for Trino
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v1/info >/dev/null && exit 0
            echo "waiting for Trino ($i)..."; sleep 5
          done; exit 1

      - name: Seed the demo table from Spark
        run: docker compose exec -T spark spark-submit /home/iceberg/jobs/seed_lakehouse.py

      - name: Wait for Superset
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8088/health >/dev/null && exit 0
            echo "waiting for Superset ($i)..."; sleep 10
          done; exit 1

      - name: Register Trino in Superset and run a query
        run: bash ../platform/viz/register-trino.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml logs --no-color superset trino

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml down -v

  airflow-dag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickstart
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env

      - name: Start the lakehouse (Trino) + Airflow
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml up -d --build trino airflow

      - name: Wait for Trino
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T trino trino --execute 'SELECT 1' >/dev/null 2>&1 && exit 0
            echo "waiting for Trino ($i)..."; sleep 5
          done; exit 1

      - name: Wait for Airflow
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8082/health >/dev/null && exit 0
            echo "waiting for Airflow ($i)..."; sleep 10
          done; exit 1

      - name: Assert the DAG parses and is listed
        run: |
          for i in $(seq 1 12); do
            if docker compose exec -T airflow airflow dags list | grep -q lakehouse_smoke; then
              echo "DAG found"; break
            fi
            echo "waiting for DAG parse ($i)..."; sleep 10
            [ "$i" = "12" ] && { echo "lakehouse_smoke DAG not found"; exit 1; }
          done

      - name: Run the DAG end-to-end (real Trino operators)
        run: |
          # extract -> load (Trino write) -> verify (SQLValueCheck count == 4).
          # `dags test` runs synchronously and fails the step if any task fails.
          docker compose exec -T airflow airflow dags test lakehouse_smoke 2026-06-01
          # Belt-and-suspenders: confirm the governed table really has 4 rows.
          n=$(docker compose exec -T trino trino --execute "SELECT count(*) FROM iceberg.smoke.events" | tr -d '"')
          echo "row count = $n"; [ "$n" = "4" ]

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml logs --no-color airflow trino

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml down -v

  mlflow-track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickstart
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env

      - name: Start MLflow (and MinIO via its bucket init)
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml up -d --build mlflow

      - name: Wait for MLflow
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5000/health >/dev/null && exit 0
            echo "waiting for MLflow ($i)..."; sleep 5
          done; exit 1

      - name: Log a run and read it back
        run: bash ../platform/ml/log-run.sh

      - name: Register a model in the MLflow Model Registry
        run: bash ../platform/ml/register-model.sh

      - name: Serve a model and POST an inference request
        run: bash ../platform/ml/serve-model.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml logs --no-color mlflow mlflow-init

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml down -v

  streaming:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickstart
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env

      - name: Start Kafka and NiFi
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml up -d kafka nifi

      - name: Wait for the Kafka broker
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T kafka \
                 /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka is up"; exit 0
            fi
            echo "waiting for Kafka ($i)..."; sleep 5
          done; exit 1

      - name: Produce and consume a message (round-trip proof)
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --create --topic odp-events \
            --partitions 1 --replication-factor 1
          echo "hello-odp" | docker compose exec -T kafka \
            /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic odp-events
          OUT=$(docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic odp-events \
            --from-beginning --timeout-ms 15000 --max-messages 1)
          echo "consumed: $OUT"
          echo "$OUT" | grep -q hello-odp

      - name: Wait for NiFi REST/UI
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8095/nifi/ >/dev/null && { echo "NiFi is up"; exit 0; }
            echo "waiting for NiFi ($i)..."; sleep 10
          done; exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml logs --no-color kafka nifi

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml down -v
