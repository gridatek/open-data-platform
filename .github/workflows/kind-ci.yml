name: kind-ci

# Phase 5: deploy the umbrella's lakehouse subset onto a real (kind) Kubernetes
# cluster and prove Trino can write+read the Iceberg REST catalog backed by
# MinIO — the K8s counterpart of quickstart-ci. Catches things `helm lint` /
# `helm template` can't, e.g. unschedulable resource requests.

on:
  push:
    branches: [main]
    paths:
      - "platform/umbrella/**"
      - "platform/governance/**"
      - "platform/engineering/**"
      - ".github/workflows/kind-ci.yml"
  pull_request:
    paths:
      - "platform/umbrella/**"
      - "platform/governance/**"
      - "platform/engineering/**"
      - ".github/workflows/kind-ci.yml"
  workflow_dispatch:

jobs:
  lakehouse-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the lakehouse subset
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            --wait --timeout 8m

      - name: Trino write/read round-trip (Iceberg REST + MinIO)
        run: |
          COORD=$(kubectl -n odp get pod -l app.kubernetes.io/component=coordinator -o name | head -1)
          kubectl -n odp exec -i "$COORD" -- trino --execute "
            CREATE SCHEMA IF NOT EXISTS iceberg.kind_smoke;
            CREATE TABLE IF NOT EXISTS iceberg.kind_smoke.events (id int, kind varchar);
            INSERT INTO iceberg.kind_smoke.events VALUES (1,'purchase'),(2,'refund');
          "
          OUT=$(kubectl -n odp exec -i "$COORD" -- trino --execute \
            "SELECT kind FROM iceberg.kind_smoke.events WHERE id = 1" | tr -d '"[:space:]')
          echo "trino sees: $OUT"
          test "$OUT" = "purchase"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=trino --tail=120 --all-containers || true
          kubectl -n odp logs -l app.kubernetes.io/name=iceberg-rest --tail=120 || true
          kubectl -n odp logs -l app=minio --tail=120 || true

  # The SDX masking proof on a real cluster: Ranger + the Trino Ranger plugin,
  # then assert a column-mask policy hides a value from the analyst. Heavier —
  # builds the Ranger admin image (the slow part) and stands up the governance
  # stack. Runs in parallel with the lakehouse job above.
  masking-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Build and load the Ranger admin image
        run: |
          # Tag it as the chart's default (ghcr) image and load it into the node;
          # imagePullPolicy IfNotPresent then uses the local copy without pulling.
          docker build -t ghcr.io/gridatek/ranger-admin:2.4.0 platform/governance/ranger
          kind load docker-image ghcr.io/gridatek/ranger-admin:2.4.0 --name odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the governance stack (lakehouse + Ranger + Trino plugin)
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-governance-values.yaml \
            --wait --timeout 12m

      - name: Masking proof — admin sees the value, analyst sees it masked
        run: NS=odp bash platform/governance/kind-masking-proof.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=trino --tail=150 --all-containers || true
          kubectl -n odp logs -l app.kubernetes.io/component=admin --tail=150 || true
          kubectl -n odp logs -l app.kubernetes.io/name=ranger --tail=150 || true

  # Orchestration on a real cluster: deploy the umbrella's Airflow (our 3.2.0 +
  # Trino-provider image, LocalExecutor, the git-synced lakehouse_smoke DAG) next
  # to the lakehouse, then run the DAG and assert it wrote the governed table
  # through Trino. Proves the Helm Airflow wiring at runtime, not just in render.
  airflow-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Build and load the Airflow image (3.2.0 + Trino provider)
        run: |
          # Match the chart's appVersion; tag as the umbrella's image and load it
          # so imagePullPolicy IfNotPresent uses the local copy (no private pull).
          docker build --build-arg AIRFLOW_VERSION=3.2.0 \
            -t ghcr.io/gridatek/airflow:3.2.0 platform/engineering/airflow
          kind load docker-image ghcr.io/gridatek/airflow:3.2.0 --name odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the lakehouse + Airflow
        run: |
          # git-sync the DAG from the ref under test (the branch on a PR, main on push).
          REF="${{ github.head_ref || github.ref_name }}"
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-airflow-values.yaml \
            --set airflow.dags.gitSync.ref="$REF" \
            --wait --timeout 12m

      - name: Run the DAG end-to-end (real Trino operators)
        run: NS=odp bash platform/engineering/airflow-on-kind.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l component=scheduler -c scheduler --tail=150 || true
          kubectl -n odp logs -l component=dag-processor --tail=120 || true
          kubectl -n odp logs -l app.kubernetes.io/name=trino --tail=120 --all-containers || true

  # BI on a real cluster: deploy the umbrella's Superset (our Trino-dialect image,
  # metadata in the bundled Postgres, the Trino connection seeded at init) next to
  # the lakehouse, then drive its API to query the governed Iceberg table through
  # Trino. Proves the Helm Superset wiring at runtime, not just in render.
  superset-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Build and load the Superset image (Trino dialect + psycopg2)
        run: |
          # Tag as the umbrella's image and load it so imagePullPolicy IfNotPresent
          # uses the local copy (no private GHCR pull).
          docker build -t ghcr.io/gridatek/superset:latest platform/viz/superset
          kind load docker-image ghcr.io/gridatek/superset:latest --name odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the lakehouse + Superset
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-superset-values.yaml \
            --wait --timeout 12m

      - name: Query the governed table through Superset → Trino
        run: NS=odp bash platform/viz/superset-on-kind.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=superset --tail=150 --all-containers || true
          kubectl -n odp logs -l app.kubernetes.io/name=trino --tail=120 --all-containers || true

  # Compute engine on a real cluster: deploy the umbrella's Spark (spark-iceberg,
  # its `demo` catalog wired to iceberg-rest + minio) next to the lakehouse, then
  # write an Iceberg table through Spark and assert Trino reads the same table.
  # Proves the Helm Spark wiring at runtime — Spark and Trino share the catalog.
  spark-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the lakehouse + Spark
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-spark-values.yaml \
            --wait --timeout 12m

      - name: Write Iceberg through Spark, read it through Trino
        run: NS=odp bash platform/engineering/spark-on-kind.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=spark --tail=150 || true
          kubectl -n odp logs -l app.kubernetes.io/name=iceberg-rest --tail=120 || true
          kubectl -n odp logs -l app.kubernetes.io/name=trino --tail=120 --all-containers || true

  # Control plane on a real cluster: deploy the console API (its ServiceAccount +
  # RBAC) next to the lakehouse, then assert it reports service health, browses
  # the Iceberg REST catalog, and scales a Deployment through the K8s API.
  console-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Build and load the console API image
        run: |
          docker build -t ghcr.io/gridatek/console-api:latest console/api
          kind load docker-image ghcr.io/gridatek/console-api:latest --name odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the lakehouse + console
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-console-values.yaml \
            --wait --timeout 12m

      - name: Console proof — health, catalog browse, scale via RBAC
        run: NS=odp bash console/console-on-kind.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=console --tail=150 || true
          kubectl -n odp logs -l app.kubernetes.io/name=iceberg-rest --tail=120 || true

  # Notebooks on a real cluster: deploy JupyterHub (standalone, no lakehouse) and
  # assert the hub comes up and spawns a single-user notebook server.
  jupyterhub-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Build and load the JupyterHub image
        run: |
          docker build -t ghcr.io/gridatek/jupyterhub:latest platform/ml/jupyterhub
          kind load docker-image ghcr.io/gridatek/jupyterhub:latest --name odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install JupyterHub
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-jupyterhub-values.yaml \
            --wait --timeout 10m

      - name: Spawn a notebook server (hub up + spawn)
        run: |
          kubectl -n odp port-forward svc/jupyterhub 8000:8000 >/tmp/jh-pf.log 2>&1 &
          sleep 5
          HUB_URL=http://localhost:8000 bash platform/ml/jupyterhub/smoke.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=jupyterhub --tail=150 || true

  # ML tracking on a real cluster: deploy MLflow (+ MinIO for artifacts) with its
  # S3 creds from the shared Secret and its Postgres password from the mlflow
  # Secret, then log a run and read it back. MLflow's first runtime proof.
  mlflow-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Build and load the MLflow image
        run: |
          docker build -t ghcr.io/gridatek/mlflow:latest platform/ml/mlflow
          kind load docker-image ghcr.io/gridatek/mlflow:latest --name odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install MinIO + MLflow
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-mlflow-values.yaml \
            --wait --timeout 12m

      - name: Log a run and read it back (creds from Secrets)
        run: |
          kubectl -n odp port-forward svc/mlflow 5000:5000 >/tmp/ml-pf.log 2>&1 &
          # mlflow answers /health before its gunicorn workers fully serve the
          # DB-backed endpoints; retry the whole proof to ride out that warmup
          # (and any port-forward hiccup).
          for attempt in 1 2 3 4 5; do
            sleep 6
            MLFLOW_URL=http://localhost:5000 bash platform/ml/log-run.sh && exit 0
            echo "log-run attempt ${attempt} failed; retrying ..."
          done
          echo "mlflow proof failed after retries"; cat /tmp/ml-pf.log; exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=mlflow --tail=150 --all-containers || true

  # Lineage on a real cluster: deploy Atlas standalone and assert it comes up and
  # its health probes authenticate with the admin creds from the shared Secret
  # (exec wget, no Basic-auth header baked into the manifest).
  #
  # Atlas (embedded HBase + Solr + JanusGraph) is too heavy to reliably reach
  # Ready inside a GitHub runner's window — so this is BEST-EFFORT
  # (continue-on-error): it still renders the change + attempts the runtime proof,
  # but a timeout here doesn't block the PR. The secret/exec-probe change itself
  # is covered by helm-ci lint/template.
  atlas-on-kind:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install Atlas
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-atlas-values.yaml \
            --wait --timeout 18m

      - name: Atlas proof — up + authenticated via the Secret
        run: NS=odp bash platform/governance/atlas-on-kind.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=atlas --tail=200 || true