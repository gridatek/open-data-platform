name: kind-ci

# Phase 5: deploy the umbrella's lakehouse subset onto a real (kind) Kubernetes
# cluster and prove Trino can write+read the Iceberg REST catalog backed by
# MinIO — the K8s counterpart of quickstart-ci. Catches things `helm lint` /
# `helm template` can't, e.g. unschedulable resource requests.

on:
  push:
    branches: [main]
    paths:
      - "platform/umbrella/**"
      - "platform/governance/**"
      - "platform/engineering/**"
      - ".github/workflows/kind-ci.yml"
  pull_request:
    paths:
      - "platform/umbrella/**"
      - "platform/governance/**"
      - "platform/engineering/**"
      - ".github/workflows/kind-ci.yml"
  workflow_dispatch:

jobs:
  lakehouse-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the lakehouse subset
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            --wait --timeout 8m

      - name: Trino write/read round-trip (Iceberg REST + MinIO)
        run: |
          COORD=$(kubectl -n odp get pod -l app.kubernetes.io/component=coordinator -o name | head -1)
          kubectl -n odp exec -i "$COORD" -- trino --execute "
            CREATE SCHEMA IF NOT EXISTS iceberg.kind_smoke;
            CREATE TABLE IF NOT EXISTS iceberg.kind_smoke.events (id int, kind varchar);
            INSERT INTO iceberg.kind_smoke.events VALUES (1,'purchase'),(2,'refund');
          "
          OUT=$(kubectl -n odp exec -i "$COORD" -- trino --execute \
            "SELECT kind FROM iceberg.kind_smoke.events WHERE id = 1" | tr -d '"[:space:]')
          echo "trino sees: $OUT"
          test "$OUT" = "purchase"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=trino --tail=120 --all-containers || true
          kubectl -n odp logs -l app.kubernetes.io/name=iceberg-rest --tail=120 || true
          kubectl -n odp logs -l app=minio --tail=120 || true

  # The SDX masking proof on a real cluster: Ranger + the Trino Ranger plugin,
  # then assert a column-mask policy hides a value from the analyst. Heavier —
  # builds the Ranger admin image (the slow part) and stands up the governance
  # stack. Runs in parallel with the lakehouse job above.
  masking-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Build and load the Ranger admin image
        run: |
          # Tag it as the chart's default (ghcr) image and load it into the node;
          # imagePullPolicy IfNotPresent then uses the local copy without pulling.
          docker build -t ghcr.io/gridatek/ranger-admin:2.4.0 platform/governance/ranger
          kind load docker-image ghcr.io/gridatek/ranger-admin:2.4.0 --name odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the governance stack (lakehouse + Ranger + Trino plugin)
        run: |
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-governance-values.yaml \
            --wait --timeout 12m

      - name: Masking proof — admin sees the value, analyst sees it masked
        run: NS=odp bash platform/governance/kind-masking-proof.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l app.kubernetes.io/name=trino --tail=150 --all-containers || true
          kubectl -n odp logs -l app.kubernetes.io/component=admin --tail=150 || true
          kubectl -n odp logs -l app.kubernetes.io/name=ranger --tail=150 || true

  # Orchestration on a real cluster: deploy the umbrella's Airflow (our 3.2.0 +
  # Trino-provider image, LocalExecutor, the git-synced lakehouse_smoke DAG) next
  # to the lakehouse, then run the DAG and assert it wrote the governed table
  # through Trino. Proves the Helm Airflow wiring at runtime, not just in render.
  airflow-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: odp

      - name: Build and load the Airflow image (3.2.0 + Trino provider)
        run: |
          # Match the chart's appVersion; tag as the umbrella's image and load it
          # so imagePullPolicy IfNotPresent uses the local copy (no private pull).
          docker build --build-arg AIRFLOW_VERSION=3.2.0 \
            -t ghcr.io/gridatek/airflow:3.2.0 platform/engineering/airflow
          kind load docker-image ghcr.io/gridatek/airflow:3.2.0 --name odp

      - name: Add chart repos
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add trino https://trinodb.github.io/charts
          helm repo add superset https://apache.github.io/superset
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build platform/umbrella

      - name: Install the lakehouse + Airflow
        run: |
          # git-sync the DAG from the ref under test (the branch on a PR, main on push).
          REF="${{ github.head_ref || github.ref_name }}"
          helm install odp platform/umbrella -n odp --create-namespace \
            -f platform/umbrella/ci/kind-values.yaml \
            -f platform/umbrella/ci/kind-airflow-values.yaml \
            --set airflow.dags.gitSync.ref="$REF" \
            --wait --timeout 12m

      - name: Run the DAG end-to-end (real Trino operators)
        run: NS=odp bash platform/engineering/airflow-on-kind.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n odp get pods -o wide || true
          kubectl -n odp describe pods || true
          kubectl -n odp logs -l component=scheduler -c scheduler --tail=150 || true
          kubectl -n odp logs -l component=dag-processor --tail=120 || true
          kubectl -n odp logs -l app.kubernetes.io/name=trino --tail=120 --all-containers || true
