name: flow-ci

# Data Flow: bring up NiFi and prove it builds + runs an automated flow through
# the REST API (the compose counterpart of the platform's CDF tier).
on:
  push:
    branches: [main]
    paths: ["platform/flow/**", "quickstart/**", ".github/workflows/flow-ci.yml"]
  pull_request:
    paths: ["platform/flow/**", "quickstart/**", ".github/workflows/flow-ci.yml"]
  workflow_dispatch:

jobs:
  nifi-flow:
    runs-on: ubuntu-latest
    # Cap the job so a Docker Hub pull stall fails fast, never the 6h default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: quickstart
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: Start NiFi
        run: |
          for i in 1 2 3; do if docker compose -f docker-compose.yml -f docker-compose.services.yml up -d nifi; then break; fi; if [ "$i" = 3 ]; then echo "compose up still failing after $i attempts"; exit 1; fi; echo "compose up failed (attempt $i; likely a Docker Hub pull flake); retrying in 15s ..."; sleep 15; done
      - name: Build + run an automated flow via the REST API
        run: NIFI_URL=http://localhost:8095 bash ../platform/flow/nifi-flow.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml logs --no-color nifi
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml down -v
