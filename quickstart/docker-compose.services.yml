# ───────────────────────────────────────────────────────────────
# Phase 3 — breadth of data services (overlay on the Phase 0 lakehouse)
#
#   Superset (BI / viz)  ─┐
#                         ├─▶ Trino ─▶ governed Iceberg tables
#   Airflow (orchestration)
#
# Run with the base lakehouse:
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
#
#   Superset : http://localhost:8088   (admin / admin)
#   Airflow  : http://localhost:8082   (admin / admin — printed by `standalone`)
# ───────────────────────────────────────────────────────────────

name: odp-quickstart

services:
  # ── Superset metadata DB (Postgres) ──────────────────────────
  superset-db:
    image: postgres:15
    container_name: odp-superset-db
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - odp

  # ── Superset: BI over the lakehouse via Trino (≈ CDW / Data Viz) ──
  superset:
    build:
      context: ../platform/viz/superset
    image: ghcr.io/gridatek/superset:latest   # apache/superset + Trino dialect + psycopg2
    container_name: odp-superset
    depends_on:
      trino:
        condition: service_started
      superset-db:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-odp-dev-secret-change-me}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ../platform/viz/superset/superset_config.py:/app/superset_config.py:ro
      - superset-home:/app/superset_home
    ports:
      - "8088:8088"
    # Trino dialect is baked into the image; init the metadata DB + admin, then serve.
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin \
          --lastname User --email admin@odp.local --password admin || true &&
        superset init &&
        /usr/bin/run-server.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - odp

  # ── Airflow metadata DB (Postgres) ──────────────────────────
  airflow-db:
    image: postgres:15
    container_name: odp-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - odp

  # ── Airflow: orchestration (≈ CDE). Single-process standalone for the laptop. ──
  airflow:
    image: apache/airflow:2.10.4
    container_name: odp-airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Postgres metadata store → LocalExecutor (SequentialExecutor only existed
      # because SQLite can't do concurrent writes).
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - ../platform/engineering/airflow/dags:/opt/airflow/dags:ro
      - airflow-home:/opt/airflow
    ports:
      - "8082:8080"   # host 8082 (8080 is Trino)
    command: ["bash", "-c", "airflow standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      - odp

  # ── Create the MLflow artifact bucket in MinIO, then exit ────
  mlflow-init:
    image: minio/mc:latest
    container_name: odp-mlflow-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb --ignore-existing local/mlflow;
      echo 'mlflow bucket ready';
      "
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    networks:
      - odp

  # ── MLflow metadata DB (Postgres) ────────────────────────────
  mlflow-db:
    image: postgres:15
    container_name: odp-mlflow-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - odp

  # ── MLflow tracking server (≈ Cloudera AI / CML) ─────────────
  # Metadata in Postgres; artifacts in MinIO (s3://mlflow) via --serve-artifacts.
  mlflow:
    build:
      context: ../platform/ml/mlflow
    image: ghcr.io/gridatek/mlflow:latest   # mlflow + boto3 + psycopg2 baked in
    container_name: odp-mlflow
    depends_on:
      mlflow-init:
        condition: service_started
      mlflow-db:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "5000:5000"
    command:
      - /bin/sh
      - -c
      - |
        mlflow server --host 0.0.0.0 --port 5000 \
          --backend-store-uri postgresql://mlflow:mlflow@mlflow-db:5432/mlflow \
          --artifacts-destination s3://mlflow/ --serve-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - odp

  # ── Kafka: streaming broker, KRaft single-node (≈ CDF) ───────
  kafka:
    image: apache/kafka:3.8.1
    container_name: odp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    networks:
      - odp

  # ── NiFi: flow authoring (≈ CDF). Plain HTTP, anonymous, for the laptop. ──
  nifi:
    image: apache/nifi:1.28.1
    container_name: odp-nifi
    environment:
      NIFI_WEB_HTTP_HOST: "0.0.0.0"
      NIFI_WEB_HTTP_PORT: "8080"
    ports:
      - "8095:8080"
    networks:
      - odp

volumes:
  superset-home:
  superset-db-data:
  airflow-home:
  airflow-db-data:
  mlflow-db-data:
