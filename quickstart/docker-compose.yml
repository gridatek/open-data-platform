# ───────────────────────────────────────────────────────────────
# Open Data Platform — Phase 0: Lakehouse core
#
#   MinIO (S3)  →  Iceberg REST catalog  →  Trino (query) + Spark (write)
#
# Goal: one bucket, one Iceberg table, writable from Spark and queryable
# from Trino — the spine everything else hangs off.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
#   Trino   : http://localhost:8080        (user: any, no password)
#   Spark   : http://localhost:8888        (Jupyter notebook)
#   MinIO   : http://localhost:9001        (console)
#   Catalog : http://localhost:8181        (Iceberg REST)
# ───────────────────────────────────────────────────────────────

name: odp-quickstart

services:
  # ── Object storage (S3 API) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: odp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_DOMAIN: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      odp:
        aliases:
          - warehouse.minio   # virtual-host-style bucket access

  # ── Create the warehouse bucket, then exit ───────────────────
  minio-init:
    image: minio/mc:latest
    container_name: odp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY};
      mc mb --ignore-existing local/${LAKEHOUSE_BUCKET};
      mc anonymous set public local/${LAKEHOUSE_BUCKET};
      echo 'bucket ${LAKEHOUSE_BUCKET} ready';
      "
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    networks:
      - odp

  # ── Iceberg REST catalog (the shared metadata layer) ─────────
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: odp-iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      CATALOG_WAREHOUSE: s3://${LAKEHOUSE_BUCKET}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    networks:
      - odp

  # ── Trino: SQL query engine over Iceberg (≈ CDW) ─────────────
  trino:
    image: trinodb/trino:latest
    container_name: odp-trino
    depends_on:
      - iceberg-rest
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog:ro
    networks:
      - odp

  # ── Spark + Iceberg: write side, with a Jupyter notebook (≈ CDE) ──
  spark:
    image: tabulario/spark-iceberg:latest
    container_name: odp-spark
    depends_on:
      - iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark UI (per-application)
    volumes:
      - ./spark/notebooks:/home/iceberg/notebooks/notebooks
    networks:
      - odp

volumes:
  minio-data:

networks:
  odp:
    name: odp
