# Enable the native Apache Ranger access control (built into Trino >= 466).
# Ranger 2.5.0+ ships the Trino service definition, so `type: trino` works.
access-control.name=ranger
ranger.service.name=trino-odp
# Absolute paths: Trino's RangerConfig resolves each entry as a File relative to
# the process working directory (not /etc/trino), so bare names won't be found.
ranger.plugin.config.resource=/etc/trino/ranger-trino-security.xml,/etc/trino/ranger-trino-audit.xml,/etc/trino/ranger-policymgr-ssl.xml
