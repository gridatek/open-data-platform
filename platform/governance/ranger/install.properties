# Ranger Admin install.properties template.
# Placeholders of the form __VAR__ are substituted by entrypoint.sh from env.
# See Ranger docs for the full property reference.

# ── Backing database (Postgres) ───────────────────────────────
DB_FLAVOR=POSTGRES
SQL_CONNECTOR_JAR=/usr/share/java/postgresql.jar
db_root_user=__RANGER_DB_USER__
db_root_password=__RANGER_DB_PASSWORD__
db_host=__RANGER_DB_HOST__:__RANGER_DB_PORT__
db_name=__RANGER_DB_NAME__
db_user=__RANGER_DB_USER__
db_password=__RANGER_DB_PASSWORD__

# ── Admin web app ─────────────────────────────────────────────
policymgr_external_url=http://localhost:6080
policymgr_http_enabled=true
rangerAdmin_password=__RANGER_ADMIN_PASSWORD__
rangerTagsync_password=__RANGER_ADMIN_PASSWORD__
rangerUsersync_password=__RANGER_ADMIN_PASSWORD__
keyadmin_password=__RANGER_ADMIN_PASSWORD__

# ── Auth: local Ranger users only for the quickstart ──────────
authentication_method=NONE

# ── Audit: disabled for the laptop subset (no Solr/ES) ────────
audit_store=
audit_solr_urls=

# Unix user/group that owns the install (created by entrypoint).
unix_user=ranger
unix_group=ranger
