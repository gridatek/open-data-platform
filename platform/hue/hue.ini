# ───────────────────────────────────────────────────────────────
# Hue config overlay (z-hue.ini) for the Open Data Platform.
#
# Hue merges every *.ini in its conf dir alphabetically, so this `z-` file lands
# last and overrides the image's shipped pseudo-distributed hue.ini. It strips
# Hue down to the SQL editor and points it at the platform's Trino engine — Hue
# is the SQL-editor counterpart of Superset's SQL Lab (≈ the CDW SQL editor /
# Hue in real CDP).
# ───────────────────────────────────────────────────────────────

[desktop]
  http_host=0.0.0.0
  http_port=8888
  # Dev session/CSRF key. Override for anything real.
  secret_key=odp-dev-hue-secret-change-me
  # No Knox/CDP SSO here — the first user to log in becomes the superuser.
  # Trim Hue to the SQL editor: drop the Hadoop apps (HDFS/Oozie/HBase/…) that
  # this platform doesn't run, so the UI doesn't advertise dead endpoints.
  app_blacklist=hbase,impala,jobbrowser,jobsub,oozie,pig,search,security,spark,sqoop,zookeeper,hive,metastore,indexer,filebrowser

  [[database]]
    # Embedded SQLite metadata store — fine for a laptop/dev. Point at Postgres
    # for anything real (Hue keeps users, saved queries, history here).
    engine=sqlite3
    name=/usr/share/hue/desktop/desktop.db

[notebook]
  [[interpreters]]
    # Trino over the governed Iceberg catalog. Hue's native `trino` interface
    # talks to the coordinator's REST API directly (no extra driver needed).
    # The URL pins the `iceberg` catalog so SHOW SCHEMAS lands on the lakehouse.
    [[[trino]]]
      name=Trino
      interface=trino
      options='{"url": "http://trino:8080/iceberg", "user": "hue"}'
