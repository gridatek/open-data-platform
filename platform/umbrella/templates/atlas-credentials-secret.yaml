{{- if .Values.atlasCredentials.create -}}
# Atlas admin credential for the health probes. The Atlas image ships these as
# its built-in admin user; keeping them in a Secret means no Basic-auth header is
# baked into the rendered Deployment. Override before using anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.atlasCredentials.secretName }}
  labels:
    app.kubernetes.io/part-of: open-data-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  user: {{ .Values.atlasCredentials.user | quote }}
  password: {{ .Values.atlasCredentials.password | quote }}
{{- end -}}
