{{- if .Values.s3Credentials.create -}}
# Shared MinIO/S3 credential for the whole platform. One Secret instead of the
# same admin/password copy-pasted across minio, iceberg-rest, trino and spark.
# Keys are named rootUser/rootPassword so the upstream MinIO chart can consume it
# directly via `minio.existingSecret`; the local subcharts reference the same
# keys via secretKeyRef. Override the values (or point everything at your own
# pre-created Secret) before using anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3Credentials.secretName }}
  labels:
    app.kubernetes.io/part-of: open-data-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  rootUser: {{ .Values.s3Credentials.accessKey | quote }}
  rootPassword: {{ .Values.s3Credentials.secretKey | quote }}
{{- end -}}
