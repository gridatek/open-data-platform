{{- if .Values.appSecretKeys.create -}}
# Flask/session secret keys for the BI + orchestration apps, in one Secret
# instead of plaintext in values. Superset reads `superset-secret-key` (via
# extraEnvRaw); Airflow reads `api-secret-key` (via apiSecretKeySecretName — the
# chart requires exactly that key name). Setting the Airflow key also stops the
# API secret key from auto-rotating (randAlphaNum) on every helm upgrade.
# Override before using anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appSecretKeys.secretName }}
  labels:
    app.kubernetes.io/part-of: open-data-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  superset-secret-key: {{ .Values.appSecretKeys.supersetSecretKey | quote }}
  api-secret-key: {{ .Values.appSecretKeys.airflowApiSecretKey | quote }}
{{- end -}}
