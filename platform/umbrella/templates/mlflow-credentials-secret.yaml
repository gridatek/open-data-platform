{{- if .Values.mlflowCredentials.create -}}
# MLflow backend-store (Postgres) password. Keeps it out of the rendered mlflow
# server command line and the Postgres Deployment env. (MLflow's S3 artifact
# creds come from the shared odp-s3-credentials Secret, not this one.) Override
# before using anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mlflowCredentials.secretName }}
  labels:
    app.kubernetes.io/part-of: open-data-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  dbPassword: {{ .Values.mlflowCredentials.dbPassword | quote }}
{{- end -}}
