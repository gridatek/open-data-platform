{{- if .Values.rangerCredentials.create -}}
# Shared Ranger credential. The admin password is used by both the Ranger admin
# server and the console (which calls the Ranger API), and the DB user/password
# by the Ranger admin + its Postgres — so they live in one Secret instead of
# being repeated. Override the values (or set create:false and point the
# subcharts at your own Secret with the same keys) before using anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rangerCredentials.secretName }}
  labels:
    app.kubernetes.io/part-of: open-data-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  adminPassword: {{ .Values.rangerCredentials.adminPassword | quote }}
  dbUser: {{ .Values.rangerCredentials.dbUser | quote }}
  dbPassword: {{ .Values.rangerCredentials.dbPassword | quote }}
{{- end -}}
