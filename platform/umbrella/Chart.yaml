apiVersion: v2
name: open-data-platform
description: >-
  Umbrella chart for the Open Data Platform — a Kubernetes-native lakehouse with a
  shared governance layer (SDX clone) and containerized data services.
type: application
version: 0.1.0
appVersion: "0.1.0"

# Dependencies with an official upstream chart are pulled from their repos
# (versions pinned from each repo's index.yaml). The SDX layer (Iceberg REST
# catalog, Ranger, Atlas) and the streaming/ML services have no upstream chart —
# they live as local subcharts under ./charts. The Iceberg REST catalog is the
# first of those ported; Ranger/Atlas/streaming/ML are still to come. See README.
dependencies:
  # Local subchart (charts/iceberg-rest) — the shared SDX catalog spine.
  - name: iceberg-rest
    version: "0.1.0"
    condition: iceberg-rest.enabled
  # Local subchart (charts/atlas) — the SDX lineage server.
  - name: atlas
    version: "0.1.0"
    condition: atlas.enabled
  # Local subchart (charts/ranger) — the SDX policy server + its Postgres.
  - name: ranger
    version: "0.1.0"
    condition: ranger.enabled
  # Local subchart (charts/spark) — the Spark engine over the shared catalog.
  - name: spark
    version: "0.1.0"
    condition: spark.enabled
  # Local subcharts (charts/{kafka,nifi,mlflow}) — streaming + ML tier.
  - name: kafka
    version: "0.1.0"
    condition: kafka.enabled
  - name: nifi
    version: "0.1.0"
    condition: nifi.enabled
  - name: mlflow
    version: "0.1.0"
    condition: mlflow.enabled
  - name: jupyterhub
    version: "0.1.0"
    condition: jupyterhub.enabled
  # Local subchart (charts/console) — the control-plane API.
  - name: console
    version: "0.1.0"
    condition: console.enabled
  # Local subchart (charts/console-web) — the Angular UI (nginx).
  - name: console-web
    version: "0.1.0"
    condition: console-web.enabled
  # Local subchart (charts/opdb) — Operational Database (HBase + Phoenix).
  - name: opdb
    version: "0.1.0"
    condition: opdb.enabled
  - name: minio
    version: "5.4.0"
    repository: https://charts.min.io/
    condition: minio.enabled
  - name: trino
    version: "1.42.2"
    repository: https://trinodb.github.io/charts
    condition: trino.enabled
  - name: superset
    version: "0.15.5"
    repository: https://apache.github.io/superset
    condition: superset.enabled
  - name: airflow
    version: "1.21.0"
    repository: https://airflow.apache.org
    condition: airflow.enabled
