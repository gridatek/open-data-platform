apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spark.fullname" . }}-defaults
  labels:
    {{- include "spark.labels" . | nindent 4 }}
data:
  # Replaces the image's bundled spark-defaults.conf (which points the `demo`
  # catalog at host "rest"). Re-points it at the umbrella's iceberg-rest + minio
  # Services so Spark writes the same tables Trino and Superset read.
  spark-defaults.conf: |
    spark.sql.extensions                                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.{{ .Values.catalog.name }}                       org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.{{ .Values.catalog.name }}.type                  rest
    spark.sql.catalog.{{ .Values.catalog.name }}.uri                   {{ .Values.catalog.restUri }}
    spark.sql.catalog.{{ .Values.catalog.name }}.io-impl               org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.catalog.{{ .Values.catalog.name }}.warehouse             s3://{{ .Values.s3.warehouse }}/
    spark.sql.catalog.{{ .Values.catalog.name }}.s3.endpoint           {{ .Values.s3.endpoint }}
    spark.sql.catalog.{{ .Values.catalog.name }}.s3.path-style-access  {{ .Values.s3.pathStyleAccess }}
    {{- if not .Values.s3.existingSecret }}
    spark.sql.catalog.{{ .Values.catalog.name }}.s3.access-key-id      {{ .Values.s3.accessKey }}
    spark.sql.catalog.{{ .Values.catalog.name }}.s3.secret-access-key  {{ .Values.s3.secretKey }}
    {{- end }}
    spark.sql.defaultCatalog                                   {{ .Values.catalog.name }}
    spark.sql.catalogImplementation                            in-memory
