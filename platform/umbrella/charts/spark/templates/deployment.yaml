apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spark.fullname" . }}
  labels:
    {{- include "spark.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "spark.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the catalog config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "spark.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: spark
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: jupyter
              containerPort: {{ .Values.service.port }}
          env:
            # S3FileIO reads creds from the AWS default chain (these env vars).
            - name: AWS_ACCESS_KEY_ID
              {{- if .Values.s3.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeySecretKey }}
              {{- else }}
              value: {{ .Values.s3.accessKey | quote }}
              {{- end }}
            - name: AWS_SECRET_ACCESS_KEY
              {{- if .Values.s3.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeySecretKey }}
              {{- else }}
              value: {{ .Values.s3.secretKey | quote }}
              {{- end }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | quote }}
          volumeMounts:
            - name: spark-defaults
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
          readinessProbe:
            tcpSocket:
              port: jupyter
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: spark-defaults
          configMap:
            name: {{ include "spark.fullname" . }}-defaults
