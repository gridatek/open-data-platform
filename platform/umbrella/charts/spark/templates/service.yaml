apiVersion: v1
kind: Service
metadata:
  name: {{ include "spark.fullname" . }}
  labels:
    {{- include "spark.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: jupyter
      port: {{ .Values.service.port }}
      targetPort: jupyter
  selector:
    {{- include "spark.selectorLabels" . | nindent 4 }}
