apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlflow.fullname" . }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    {{- include "mlflow.server.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mlflow.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlflow.server.selectorLabels" . | nindent 8 }}
    spec:
      # mlflow server fails fast if the backend DB isn't reachable, so wait for it.
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "mlflow.db.fullname" . }} -p {{ .Values.db.service.port }} -U {{ .Values.db.user }}; do
                echo "waiting for mlflow-db..."; sleep 2
              done
      containers:
        - name: mlflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: {{ .Values.s3.endpoint | quote }}
            - name: AWS_ACCESS_KEY_ID
              {{- if .Values.s3.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeySecretKey }}
              {{- else }}
              value: {{ .Values.s3.accessKey | quote }}
              {{- end }}
            - name: AWS_SECRET_ACCESS_KEY
              {{- if .Values.s3.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeySecretKey }}
              {{- else }}
              value: {{ .Values.s3.secretKey | quote }}
              {{- end }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | quote }}
            # DB password as env so it stays out of the rendered command line; the
            # backend-store-uri references it as $MLFLOW_DB_PASSWORD below.
            - name: MLFLOW_DB_PASSWORD
              {{- if .Values.db.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: {{ .Values.db.passwordSecretKey }}
              {{- else }}
              value: {{ .Values.db.password | quote }}
              {{- end }}
          # boto3 + psycopg2 are baked into the image; serve with the Postgres
          # backend store and the MinIO-backed artifact store.
          command: ["/bin/sh", "-c"]
          args:
            - |
              mlflow server --host 0.0.0.0 --port {{ .Values.service.port }} \
                --backend-store-uri postgresql://{{ .Values.db.user }}:$MLFLOW_DB_PASSWORD@{{ include "mlflow.db.fullname" . }}:{{ .Values.db.service.port }}/{{ .Values.db.name }} \
                --artifacts-destination s3://{{ .Values.s3.bucket }}/ --serve-artifacts
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.startup.periodSeconds }}
            failureThreshold: {{ .Values.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mlflow.fullname" . }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    {{- include "mlflow.server.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "mlflow.server.selectorLabels" . | nindent 4 }}
