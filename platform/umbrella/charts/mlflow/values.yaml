# MLflow tracking server — values. K8s port of the docker-compose `mlflow` service.
# Metadata in Postgres (the db component below); artifacts in MinIO (its S3 creds
# must match the MinIO root user/password; the `mlflow` bucket is created by the
# MinIO subchart).
enabled: true

replicaCount: 1

image:
  repository: ghcr.io/gridatek/mlflow    # mlflow + boto3 + psycopg2 (publish-images.yml)
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

# Object storage for run artifacts.
s3:
  endpoint: http://minio:9000
  region: us-east-1
  bucket: mlflow
  # Preferred: read creds from an existing Secret (the umbrella points this at the
  # shared `odp-s3-credentials`). Key names default to rootUser/rootPassword.
  existingSecret: ""
  accessKeySecretKey: rootUser
  secretKeySecretKey: rootPassword
  # Fallback plaintext creds when existingSecret is empty (standalone dev only).
  accessKey: admin
  secretKey: password

# Postgres backend store (run/experiment metadata).
db:
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  user: mlflow
  # Preferred: read the password from an existing Secret (umbrella → the shared
  # `odp-mlflow-credentials`). The username isn't sensitive, so it stays inline.
  existingSecret: ""
  passwordSecretKey: dbPassword
  password: mlflow
  name: mlflow
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

startup:
  periodSeconds: 10
  failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
