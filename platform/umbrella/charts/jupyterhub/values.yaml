# JupyterHub — values. K8s port of the docker-compose `jupyterhub` service.
#
# IMPORTANT: no published image — build & load it before enabling:
#   docker build -t odp/jupyterhub:latest platform/ml/jupyterhub
#   kind load docker-image odp/jupyterhub:latest      # or push to a registry
# That's why the umbrella leaves jupyterhub.enabled=false by default.
#
# Single-node: notebook servers spawn as local processes in the hub pod
# (SimpleLocalProcessSpawner). A real multi-tenant deploy would use KubeSpawner.
enabled: true

replicaCount: 1

image:
  repository: odp/jupyterhub
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

# JupyterHub takes a little while to come up; the startupProbe budgets for it.
startup:
  periodSeconds: 10
  failureThreshold: 30

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
