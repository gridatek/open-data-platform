# JupyterHub — values. K8s port of the docker-compose `jupyterhub` service.
#
# image defaults to the GHCR image published by publish-images.yml (make the
# package public, or add an imagePullSecret, before pulling). Default off. To
# build + use locally instead:
#   docker build -t ghcr.io/gridatek/jupyterhub:latest platform/ml/jupyterhub
#   kind load docker-image ghcr.io/gridatek/jupyterhub:latest
#
# Single-node: notebook servers spawn as local processes in the hub pod
# (SimpleLocalProcessSpawner). A real multi-tenant deploy would use KubeSpawner.
enabled: true

replicaCount: 1

image:
  repository: ghcr.io/gridatek/jupyterhub
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

# JupyterHub takes a little while to come up; the startupProbe budgets for it.
startup:
  periodSeconds: 10
  failureThreshold: 30

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
