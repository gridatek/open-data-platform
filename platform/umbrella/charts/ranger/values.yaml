# Apache Ranger — values. K8s port of the docker-compose ranger-db + ranger-admin.
#
# Apache publishes no Ranger *admin* image, so it's built from
# platform/governance/ranger and published to GHCR by .github/workflows/publish-
# images.yml. admin.image defaults to that published image; make the package
# public (or add an imagePullSecret) before pulling. The umbrella still leaves
# ranger.enabled=false by default. To build + use locally instead:
#
#   docker build -t ghcr.io/gridatek/ranger-admin:2.4.0 platform/governance/ranger
#   kind load docker-image ghcr.io/gridatek/ranger-admin:2.4.0

# Set by the umbrella via `condition: ranger.enabled`.
enabled: true

# ── Ranger admin: policy server + UI ─────────────────────────
admin:
  image:
    repository: ghcr.io/gridatek/ranger-admin
    tag: "2.4.0"               # the tag the compose build produces
    pullPolicy: IfNotPresent
  # Password for the built-in `admin` user (and tagsync/usersync/keyadmin).
  password: "rangerR0cks!"
  service:
    type: ClusterIP
    port: 6080
  # Schema setup + JVM start is slow; the startupProbe budgets for it.
  startup:
    periodSeconds: 10
    failureThreshold: 60
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

# ── Ranger metadata DB (Postgres) ────────────────────────────
db:
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  user: rangeradmin
  password: rangeradmin
  name: ranger
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: ""        # use the cluster default unless set
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
