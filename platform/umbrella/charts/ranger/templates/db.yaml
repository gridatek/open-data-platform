{{- if .Values.db.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ranger.db.fullname" . }}
  labels:
    {{- include "ranger.labels" . | nindent 4 }}
    {{- include "ranger.db.selectorLabels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.db.persistence.size }}
  {{- with .Values.db.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ranger.db.fullname" . }}
  labels:
    {{- include "ranger.labels" . | nindent 4 }}
    {{- include "ranger.db.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  # One Postgres pod bound to one RWO volume — never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ranger.db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ranger.db.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.db.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.user | quote }}, "-d", {{ .Values.db.name | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.user | quote }}, "-d", {{ .Values.db.name | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
      volumes:
        - name: data
        {{- if .Values.db.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ranger.db.fullname" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ranger.db.fullname" . }}
  labels:
    {{- include "ranger.labels" . | nindent 4 }}
    {{- include "ranger.db.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.db.service.port }}
      targetPort: postgres
  selector:
    {{- include "ranger.db.selectorLabels" . | nindent 4 }}
