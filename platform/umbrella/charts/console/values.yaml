# Console API — values. K8s port of the docker-compose `console-api` service.
#
# image defaults to the GHCR image published by publish-images.yml (make the
# package public, or add an imagePullSecret, before pulling). The umbrella leaves
# console.enabled=false by default. To build + use locally instead:
#   docker build -t ghcr.io/gridatek/console-api:latest console/api
#   kind load docker-image ghcr.io/gridatek/console-api:latest
#
# The API only makes HTTP calls (health/catalog/ranger), so it needs no K8s RBAC.
enabled: true

replicaCount: 1

image:
  repository: ghcr.io/gridatek/console-api
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090

# Where the console reaches the rest of the platform. Defaults use the stable
# in-cluster Service names the umbrella pins (trino via trino.fullnameOverride).
endpoints:
  catalogRestUrl: http://iceberg-rest:8181
  ranger:
    url: http://ranger-admin:6080
    serviceName: trino-odp
    username: admin
    # Preferred: read the Ranger admin password from an existing Secret (the
    # umbrella points this at the shared `odp-ranger-credentials`). Falls back to
    # the plaintext password below when existingSecret is empty.
    existingSecret: ""
    passwordSecretKey: adminPassword
    password: "rangerR0cks!"
  health:
    minio: http://minio:9000/minio/health/live
    catalog: http://iceberg-rest:8181/v1/config
    trino: http://trino:8080/v1/info
    ranger: http://ranger-admin:6080/login.jsp
    atlas: http://atlas:21000/api/atlas/admin/version

# Service lifecycle (restart/scale) needs the Kubernetes API. The chart creates a
# ServiceAccount + a Role/RoleBinding scoped to patch Deployments in this
# namespace, and turns on odp.k8s.enabled in the API. Set rbac.create=false (and
# k8s.enabled=false) for a read-only console.
rbac:
  create: true
serviceAccount:
  create: true
  name: ""              # defaults to the chart fullname (console-api)
k8s:
  enabled: true
  namespace: ""         # defaults to the release namespace

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
