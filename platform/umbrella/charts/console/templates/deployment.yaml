apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "console.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      containers:
        - name: console-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            # Service lifecycle (restart/scale) against the K8s API in this
            # namespace, via the bound ServiceAccount's RBAC.
            - name: ODP_K8S_ENABLED
              value: {{ .Values.k8s.enabled | quote }}
            - name: ODP_K8S_NAMESPACE
              value: {{ .Values.k8s.namespace | default .Release.Namespace | quote }}
            # Matches the ODP_* env the docker-compose console-api consumes,
            # pointed at the in-cluster Service names.
            - name: ODP_CATALOG_REST_URL
              value: {{ .Values.endpoints.catalogRestUrl | quote }}
            - name: ODP_RANGER_URL
              value: {{ .Values.endpoints.ranger.url | quote }}
            - name: ODP_RANGER_SERVICE_NAME
              value: {{ .Values.endpoints.ranger.serviceName | quote }}
            - name: ODP_RANGER_USERNAME
              value: {{ .Values.endpoints.ranger.username | quote }}
            - name: ODP_RANGER_PASSWORD
              value: {{ .Values.endpoints.ranger.password | quote }}
            - name: ODP_HEALTH_MINIO
              value: {{ .Values.endpoints.health.minio | quote }}
            - name: ODP_HEALTH_CATALOG
              value: {{ .Values.endpoints.health.catalog | quote }}
            - name: ODP_HEALTH_TRINO
              value: {{ .Values.endpoints.health.trino | quote }}
            - name: ODP_HEALTH_RANGER
              value: {{ .Values.endpoints.health.ranger | quote }}
            - name: ODP_HEALTH_ATLAS
              value: {{ .Values.endpoints.health.atlas | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "console.selectorLabels" . | nindent 4 }}
