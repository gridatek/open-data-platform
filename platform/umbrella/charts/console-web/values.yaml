# Console web (Angular + nginx) — values.
#
# image defaults to the GHCR image published by publish-images.yml (make the
# package public, or add an imagePullSecret, before pulling). Default off. To
# build + use locally instead:
#   docker build -t ghcr.io/gridatek/console-web:latest console/web
#   kind load docker-image ghcr.io/gridatek/console-web:latest
enabled: true

replicaCount: 1

image:
  repository: ghcr.io/gridatek/console-web
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

# Where nginx proxies the SPA's /api/* calls — the console API Service.
apiUpstream: console-api:8090

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
