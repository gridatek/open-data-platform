apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.fullname" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "atlas.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atlas.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: atlas
          image: {{ include "atlas.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command override: the image's default CMD starts Atlas and tails
          # its log from the correct path (see the compose service note).
          # Atlas admin creds for the health probes. Preferred: from a Secret; the
          # probes read them as env so no Basic-auth header is baked into the
          # rendered manifest. (The Atlas image ships these as its admin user.)
          env:
            - name: ATLAS_USER
              {{- if .Values.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.userSecretKey }}
              {{- else }}
              value: {{ .Values.auth.user | quote }}
              {{- end }}
            - name: ATLAS_PASSWORD
              {{- if .Values.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordSecretKey }}
              {{- else }}
              value: {{ .Values.auth.password | quote }}
              {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          # Embedded HBase/Solr take a few minutes — the startupProbe gates the
          # liveness check so a slow boot isn't mistaken for a crash. The probes
          # exec wget with the creds from env (httpGet headers can't use Secrets).
          startupProbe:
            exec:
              command:
                {{- include "atlas.probeCommand" . | nindent 16 }}
            periodSeconds: {{ .Values.startup.periodSeconds }}
            failureThreshold: {{ .Values.startup.failureThreshold }}
          readinessProbe:
            exec:
              command:
                {{- include "atlas.probeCommand" . | nindent 16 }}
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                {{- include "atlas.probeCommand" . | nindent 16 }}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
