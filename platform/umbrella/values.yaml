# Open Data Platform — umbrella values.
#
# Phase 5 scaffold: wires the data services that have official upstream charts.
# Toggle each with <name>.enabled. Secrets here are placeholders — override with
# --set or a sealed secret in any real cluster.

# ── Object storage (the lakehouse foundation) ────────────────
# fullnameOverride pins the Service to `minio` so the catalog and Trino can
# address it by a stable DNS name regardless of the Helm release name.
minio:
  enabled: true
  fullnameOverride: minio
  mode: standalone
  rootUser: admin
  rootPassword: password          # >= 8 chars; matches the S3 creds below
  persistence:
    size: 10Gi
  buckets:
    - name: warehouse
      policy: none
    - name: mlflow
      policy: none

# ── Iceberg REST catalog (SDX spine, local subchart) ─────────
# fullnameOverride pins the Service to `iceberg-rest` so Trino/Spark reach it at
# a stable name. Its S3 creds must match the MinIO root user/password above.
iceberg-rest:
  enabled: true
  fullnameOverride: iceberg-rest
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    warehouse: warehouse
    pathStyleAccess: true
    accessKey: admin
    secretKey: password

# ── SDX lineage — Apache Atlas (local subchart) ──────────────
# Heavy (embedded HBase + Solr, ~3Gi, slow to start). Disable on small clusters
# with --set atlas.enabled=false. Stable Service name `atlas` for register-lineage.
atlas:
  enabled: true
  fullnameOverride: atlas
  auth:
    user: admin
    password: admin

# ── Query engine ─────────────────────────────────────────────
trino:
  enabled: true
  server:
    workers: 2
  # Wire the Iceberg connector to the shared REST catalog + MinIO so Trino and
  # Spark see the same tables (mirrors quickstart/trino/etc/catalog/iceberg.properties).
  # Dev-only S3 creds — keep in sync with minio.rootUser/rootPassword above.
  additionalCatalogs:
    iceberg: |
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://iceberg-rest:8181
      iceberg.rest-catalog.warehouse=s3://warehouse/
      fs.native-s3.enabled=true
      s3.endpoint=http://minio:9000
      s3.region=us-east-1
      s3.path-style-access=true
      s3.aws-access-key=admin
      s3.aws-secret-key=password

# ── BI / viz — enable once the Trino connection is templated ──
superset:
  enabled: false

# ── Orchestration — enable once DAGs ship via git-sync/image ──
airflow:
  enabled: false

# ── Not yet wired: need local subcharts under ./charts ───────
# These mirror the docker-compose services; porting each to a chart is the
# remaining Phase 5 work (Iceberg REST catalog + Atlas above are done).
ranger:
  enabled: false   # SDX policies (the masking proof)
kafka:
  enabled: false   # streaming
nifi:
  enabled: false   # flow authoring
mlflow:
  enabled: false   # experiment tracking
console:
  enabled: false   # the control-plane API + web
