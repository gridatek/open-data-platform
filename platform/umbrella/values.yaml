# Open Data Platform — umbrella values.
#
# Phase 5 scaffold: wires the data services that have official upstream charts.
# Toggle each with <name>.enabled. Secrets here are placeholders — override with
# --set or a sealed secret in any real cluster.

# ── Object storage (the lakehouse foundation) ────────────────
# fullnameOverride pins the Service to `minio` so the catalog and Trino can
# address it by a stable DNS name regardless of the Helm release name.
minio:
  enabled: true
  fullnameOverride: minio
  mode: standalone
  rootUser: admin
  rootPassword: password          # >= 8 chars; matches the S3 creds below
  persistence:
    size: 10Gi
  buckets:
    - name: warehouse
      policy: none
    - name: mlflow
      policy: none
  # The minio chart requests 16Gi by default (production sizing) — too large to
  # schedule on a laptop/kind node. Standalone dev MinIO is light; cap it.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi

# ── Iceberg REST catalog (SDX spine, local subchart) ─────────
# fullnameOverride pins the Service to `iceberg-rest` so Trino/Spark reach it at
# a stable name. Its S3 creds must match the MinIO root user/password above.
iceberg-rest:
  enabled: true
  fullnameOverride: iceberg-rest
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    warehouse: warehouse
    pathStyleAccess: true
    accessKey: admin
    secretKey: password

# ── SDX lineage — Apache Atlas (local subchart) ──────────────
# Heavy (embedded HBase + Solr, ~3Gi, slow to start). Disable on small clusters
# with --set atlas.enabled=false. Stable Service name `atlas` for register-lineage.
atlas:
  enabled: true
  fullnameOverride: atlas
  auth:
    user: admin
    password: admin

# ── Query engine ─────────────────────────────────────────────
# fullnameOverride pins the Services to `trino` / `trino-worker` so the console
# (and anything else) can reach the coordinator at a stable `trino:8080`.
trino:
  enabled: true
  fullnameOverride: trino
  server:
    workers: 2
  # Wire the Iceberg connector to the shared REST catalog + MinIO so Trino and
  # Spark see the same tables (mirrors quickstart/trino/etc/catalog/iceberg.properties).
  # Dev-only S3 creds — keep in sync with minio.rootUser/rootPassword above.
  additionalCatalogs:
    iceberg: |
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://iceberg-rest:8181
      iceberg.rest-catalog.warehouse=s3://warehouse/
      fs.native-s3.enabled=true
      s3.endpoint=http://minio:9000
      s3.region=us-east-1
      s3.path-style-access=true
      s3.aws-access-key=admin
      s3.aws-secret-key=password

# ── BI / viz — enable once the Trino connection is templated ──
superset:
  enabled: false

# ── Orchestration — enable once DAGs ship via git-sync/image ──
airflow:
  enabled: false

# ── SDX policies — Apache Ranger + its Postgres (local subchart) ──
# Default OFF: the admin image isn't published — build & load it first, then
# flip enabled=true (see charts/ranger/values.yaml):
#   docker build -t odp/ranger-admin:2.4.0 platform/governance/ranger
#   kind load docker-image odp/ranger-admin:2.4.0
# Stable Service names ranger-admin / ranger-db (fullnameOverride) for
# load-policies.sh and the Trino Ranger plugin.
ranger:
  enabled: false
  fullnameOverride: ranger
  admin:
    password: "rangerR0cks!"
  db:
    user: rangeradmin
    password: rangeradmin
    name: ranger

# ── Streaming + ML tier (local subcharts) ───────────────────
# Public images, so they "just work" — but default OFF to keep the base install
# lean (like superset/airflow). Enable with --set <name>.enabled=true. Stable
# Service names via fullnameOverride (kafka clients rely on `kafka:9092`).
kafka:
  enabled: false
  fullnameOverride: kafka
nifi:
  enabled: false
  fullnameOverride: nifi
mlflow:
  enabled: false
  fullnameOverride: mlflow
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    bucket: mlflow
    accessKey: admin
    secretKey: password

# ── Control plane — console API (local subchart) ─────────────
# Default OFF: the image isn't published — build & load it first, then enable:
#   docker build -t odp/console-api:latest console/api
#   kind load docker-image odp/console-api:latest
# Only the API is containerized; the Angular web is dev-served for now.
console:
  enabled: false
  fullnameOverride: console-api
