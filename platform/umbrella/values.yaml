# Open Data Platform — umbrella values.
#
# Phase 5 scaffold: wires the data services that have official upstream charts.
# Toggle each with <name>.enabled. Secrets here are placeholders — override with
# --set or a sealed secret in any real cluster.

# ── Object storage (the lakehouse foundation) ────────────────
# fullnameOverride pins the Service to `minio` so the catalog and Trino can
# address it by a stable DNS name regardless of the Helm release name.
minio:
  enabled: true
  fullnameOverride: minio
  mode: standalone
  rootUser: admin
  rootPassword: password          # >= 8 chars; matches the S3 creds below
  persistence:
    size: 10Gi
  buckets:
    - name: warehouse
      policy: none
    - name: mlflow
      policy: none
  # The minio chart requests 16Gi by default (production sizing) — too large to
  # schedule on a laptop/kind node. Standalone dev MinIO is light; cap it.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi

# ── Iceberg REST catalog (SDX spine, local subchart) ─────────
# fullnameOverride pins the Service to `iceberg-rest` so Trino/Spark reach it at
# a stable name. Its S3 creds must match the MinIO root user/password above.
iceberg-rest:
  enabled: true
  fullnameOverride: iceberg-rest
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    warehouse: warehouse
    pathStyleAccess: true
    accessKey: admin
    secretKey: password

# ── SDX lineage — Apache Atlas (local subchart) ──────────────
# Heavy (embedded HBase + Solr, ~3Gi, slow to start). Disable on small clusters
# with --set atlas.enabled=false. Stable Service name `atlas` for register-lineage.
atlas:
  enabled: true
  fullnameOverride: atlas
  auth:
    user: admin
    password: admin

# ── Query engine ─────────────────────────────────────────────
# fullnameOverride pins the Services to `trino` / `trino-worker` so the console
# (and anything else) can reach the coordinator at a stable `trino:8080`.
trino:
  enabled: true
  fullnameOverride: trino
  server:
    workers: 2
  # Wire the Iceberg connector to the shared REST catalog + MinIO so Trino and
  # Spark see the same tables (mirrors quickstart/trino/etc/catalog/iceberg.properties).
  # Dev-only S3 creds — keep in sync with minio.rootUser/rootPassword above.
  additionalCatalogs:
    iceberg: |
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://iceberg-rest:8181
      iceberg.rest-catalog.warehouse=s3://warehouse/
      fs.native-s3.enabled=true
      s3.endpoint=http://minio:9000
      s3.region=us-east-1
      s3.path-style-access=true
      s3.aws-access-key=admin
      s3.aws-secret-key=password

# ── BI / viz — Apache Superset (upstream chart) ──────────────
# Default OFF (heavy: web + Celery worker + Redis + its own Postgres). Now fully
# wired, so `--set superset.enabled=true` is enough:
#  • our GHCR image has the Trino dialect + psycopg2 baked in (publish-images.yml);
#  • metadata lives in the chart's bundled Postgres (postgresql.enabled, default on);
#  • the Trino connection is seeded at init via the chart's import_datasources hook,
#    pointing at the in-cluster `trino` Service.
superset:
  enabled: false
  image:
    repository: ghcr.io/gridatek/superset
    tag: latest
    pullPolicy: IfNotPresent
  # SECRET_KEY for sessions/CSRF (CSRF is on by default in the stock config).
  extraSecretEnv:
    SUPERSET_SECRET_KEY: "odp-dev-secret-change-me"
  # The init job imports any import_datasources.yaml found at the config mount,
  # so the governed Trino catalog is registered out of the box.
  extraConfigs:
    import_datasources.yaml: |
      databases:
        - database_name: trino-odp
          sqlalchemy_uri: trino://admin@trino:8080/iceberg
          expose_in_sqllab: true
  # Single-process (web only), matching the compose laptop subset. Dropping the
  # Celery worker/beat + bundled Redis also sidesteps a cross-subchart Sprig
  # `merge` context bug that breaks rendering when Superset's Redis and Airflow's
  # helpers are templated together. Sync SQL Lab queries don't need a worker.
  supersetWorker:
    enabled: false
  supersetCeleryBeat:
    enabled: false
  redis:
    enabled: false
  # Point the metadata connection at our own-named Postgres (below). Both Superset
  # and Airflow bundle a bitnami Postgres that defaults to `<release>-postgresql`,
  # which would collide — so each gets a distinct fullnameOverride.
  supersetNode:
    connections:
      db_host: superset-postgresql
  postgresql:
    fullnameOverride: superset-postgresql
    # Trim the request so it schedules on a kind node.
    primary:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi

# ── Orchestration — Apache Airflow (upstream chart) ──────────
# Default OFF. Now wired: LocalExecutor on the chart's bundled Postgres (no Redis
# /workers — leaner than Celery and matches the compose laptop subset), and the
# `lakehouse_smoke` DAG is shipped via git-sync from this repo.
airflow:
  enabled: false
  executor: LocalExecutor
  # LocalExecutor runs tasks in the scheduler — no Celery broker needed.
  redis:
    enabled: false
  # Static dev key so Helm doesn't rotate the webserver secret on every upgrade.
  webserverSecretKey: "odp-dev-airflow-secret"
  # Metadata store is the chart's bundled Postgres (postgresql.enabled, default on).
  # Distinct name so it doesn't collide with Superset's `<release>-postgresql`.
  postgresql:
    fullnameOverride: airflow-postgresql
  data:
    metadataConnection:
      host: airflow-postgresql
  dags:
    gitSync:
      enabled: true
      repo: https://github.com/gridatek/open-data-platform.git
      branch: main
      ref: main
      subPath: platform/engineering/airflow/dags

# ── SDX policies — Apache Ranger + its Postgres (local subchart) ──
# Default ON: the admin image is published to GHCR (publish-images.yml) and the
# chart points at it — make the package public (or add an imagePullSecret) to pull.
# Stable Service names ranger-admin / ranger-db (fullnameOverride) for
# load-policies.sh and the Trino Ranger plugin.
ranger:
  enabled: true
  fullnameOverride: ranger
  admin:
    password: "rangerR0cks!"
  db:
    user: rangeradmin
    password: rangeradmin
    name: ranger

# ── Streaming + ML tier (local subcharts) ───────────────────
# Public images, so they "just work" — but default OFF to keep the base install
# lean (like superset/airflow). Enable with --set <name>.enabled=true. Stable
# Service names via fullnameOverride (kafka clients rely on `kafka:9092`).
kafka:
  enabled: false
  fullnameOverride: kafka
nifi:
  enabled: false
  fullnameOverride: nifi
mlflow:
  enabled: false
  fullnameOverride: mlflow
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    bucket: mlflow
    accessKey: admin
    secretKey: password
# JupyterHub (≈ CML notebooks). Image published to GHCR; default on.
jupyterhub:
  enabled: true
  fullnameOverride: jupyterhub

# ── Control plane — console API (local subchart) ─────────────
# Default ON: image published to GHCR (make the package public to pull). Only the
# API is containerized; the Angular web is the console-web subchart below.
console:
  enabled: true
  fullnameOverride: console-api

# ── Control plane — console web UI (Angular + nginx, local subchart) ──
# Default ON: image published to GHCR. Needs the console API (nginx proxies
# /api → console-api:8090), which is also on by default above.
console-web:
  enabled: true
  fullnameOverride: console-web
  apiUpstream: console-api:8090

# ── Operational DB — HBase + Phoenix (local subchart) ────────
# Public image, default off (heavy; standalone, not tied to the lakehouse).
# Phoenix Query Server reachable at opdb:8765.
opdb:
  enabled: false
  fullnameOverride: opdb
