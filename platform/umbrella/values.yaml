# Open Data Platform — umbrella values.
#
# Phase 5 scaffold: wires the data services that have official upstream charts.
# Toggle each with <name>.enabled. Secrets here are placeholders — override with
# --set or a sealed secret in any real cluster.

# ── Object storage (the lakehouse foundation) ────────────────
# ── Shared S3 / MinIO credential ─────────────────────────────
# One Secret (templates/s3-credentials-secret.yaml) instead of the same
# admin/password repeated across minio, iceberg-rest, trino and spark. They all
# read it: minio via `existingSecret`, the rest via secretKeyRef. Override these
# (or set create:false and point `secretName` at your own Secret with the same
# rootUser/rootPassword keys) before using anywhere real.
s3Credentials:
  create: true
  secretName: odp-s3-credentials
  accessKey: admin
  secretKey: password

# fullnameOverride pins the Service to `minio` so the catalog and Trino can
# address it by a stable DNS name regardless of the Helm release name.
minio:
  enabled: true
  fullnameOverride: minio
  mode: standalone
  # Root user/password come from the shared Secret (keys rootUser/rootPassword).
  existingSecret: odp-s3-credentials
  persistence:
    size: 10Gi
  buckets:
    - name: warehouse
      policy: none
    - name: mlflow
      policy: none
  # The minio chart requests 16Gi by default (production sizing) — too large to
  # schedule on a laptop/kind node. Standalone dev MinIO is light; cap it.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi

# ── Iceberg REST catalog (SDX spine, local subchart) ─────────
# fullnameOverride pins the Service to `iceberg-rest` so Trino/Spark reach it at
# a stable name. Its S3 creds must match the MinIO root user/password above.
iceberg-rest:
  enabled: true
  fullnameOverride: iceberg-rest
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    warehouse: warehouse
    pathStyleAccess: true
    # Creds come from the shared Secret (keys rootUser/rootPassword).
    existingSecret: odp-s3-credentials

# ── Spark engine over the shared catalog (local subchart) ────
# The K8s port of the compose `spark` service. Heavy + interactive, so default
# OFF — enable with `--set spark.enabled=true`. Its `demo` catalog points at the
# iceberg-rest + minio Services above, so Spark writes the same tables Trino and
# Superset read. Stable Service name `spark`.
spark:
  enabled: false
  fullnameOverride: spark
  # S3 creds come from the shared Secret (keys rootUser/rootPassword).
  s3:
    existingSecret: odp-s3-credentials

# ── SDX lineage — Apache Atlas (local subchart) ──────────────
# Heavy (embedded HBase + Solr, ~3Gi, slow to start). Disable on small clusters
# with --set atlas.enabled=false. Stable Service name `atlas` for register-lineage.
atlas:
  enabled: true
  fullnameOverride: atlas
  auth:
    user: admin
    password: admin

# ── Query engine ─────────────────────────────────────────────
# fullnameOverride pins the Services to `trino` / `trino-worker` so the console
# (and anything else) can reach the coordinator at a stable `trino:8080`.
trino:
  enabled: true
  fullnameOverride: trino
  server:
    workers: 2
  # S3 creds come from the shared Secret as env; the native S3 filesystem falls
  # back to the AWS default credential chain (these env vars) when the catalog
  # file omits s3.aws-access-key/secret-key.
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: odp-s3-credentials
          key: rootUser
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: odp-s3-credentials
          key: rootPassword
  # Wire the Iceberg connector to the shared REST catalog + MinIO so Trino and
  # Spark see the same tables (mirrors quickstart/trino/etc/catalog/iceberg.properties).
  additionalCatalogs:
    iceberg: |
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://iceberg-rest:8181
      iceberg.rest-catalog.warehouse=s3://warehouse/
      fs.native-s3.enabled=true
      s3.endpoint=http://minio:9000
      s3.region=us-east-1
      s3.path-style-access=true

# ── BI / viz — Apache Superset (upstream chart) ──────────────
# Default OFF (heavy: web + Celery worker + Redis + its own Postgres). Now fully
# wired, so `--set superset.enabled=true` is enough:
#  • our GHCR image has the Trino dialect + psycopg2 baked in (publish-images.yml);
#  • metadata lives in the chart's bundled Postgres (postgresql.enabled, default on);
#  • the Trino connection is seeded at init via the chart's import_datasources hook,
#    pointing at the in-cluster `trino` Service.
superset:
  enabled: false
  image:
    repository: ghcr.io/gridatek/superset
    tag: latest
    pullPolicy: IfNotPresent
  # SECRET_KEY for sessions/CSRF (CSRF is on by default in the stock config).
  extraSecretEnv:
    SUPERSET_SECRET_KEY: "odp-dev-secret-change-me"
  # Single-process: no Redis (disabled below), so point the caches + the SQL Lab
  # results backend at in-process stores instead of the chart's Redis defaults —
  # otherwise even a synchronous SQL Lab query fails trying to reach Redis.
  configOverrides:
    no_redis: |
      from cachelib.file import FileSystemCache
      RESULTS_BACKEND = FileSystemCache("/tmp/superset_results", default_timeout=86400)
      CACHE_CONFIG = {"CACHE_TYPE": "SimpleCache"}
      DATA_CACHE_CONFIG = {"CACHE_TYPE": "SimpleCache"}
      FILTER_STATE_CACHE_CONFIG = {"CACHE_TYPE": "SimpleCache"}
      EXPLORE_FORM_DATA_CACHE_CONFIG = {"CACHE_TYPE": "SimpleCache"}
  # The init job imports any import_datasources.yaml found at the config mount,
  # so the governed Trino catalog is registered out of the box.
  extraConfigs:
    import_datasources.yaml: |
      databases:
        - database_name: trino-odp
          sqlalchemy_uri: trino://admin@trino:8080/iceberg
          expose_in_sqllab: true
  # Single-process (web only), matching the compose laptop subset. Dropping the
  # Celery worker/beat + bundled Redis also sidesteps a cross-subchart Sprig
  # `merge` context bug that breaks rendering when Superset's Redis and Airflow's
  # helpers are templated together. Sync SQL Lab queries don't need a worker.
  # The chart always renders the Celery worker (it has no enable flag), so scale
  # it to zero for a single-process Superset; beat is off by chart default. Sync
  # SQL Lab queries need neither, and Redis is disabled below.
  supersetWorker:
    replicas:
      replicaCount: 0
  supersetCeleryBeat:
    enabled: false
  redis:
    enabled: false
  # Point the metadata connection at our own-named Postgres (below). Both Superset
  # and Airflow bundle a bitnami Postgres that defaults to `<release>-postgresql`,
  # which would collide — so each gets a distinct fullnameOverride.
  supersetNode:
    connections:
      db_host: superset-postgresql
  postgresql:
    fullnameOverride: superset-postgresql
    # Trim the request so it schedules on a kind node.
    primary:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi

# ── Orchestration — Apache Airflow (upstream chart) ──────────
# Default OFF. Now wired: LocalExecutor on the chart's bundled Postgres (no Redis
# /workers — leaner than Celery and matches the compose laptop subset), and the
# `lakehouse_smoke` DAG is shipped via git-sync from this repo.
airflow:
  enabled: false
  executor: LocalExecutor
  # Our image (chart's Airflow 3.2.0 + the Trino provider baked in) so the
  # git-synced lakehouse_smoke DAG's operators import.
  images:
    airflow:
      repository: ghcr.io/gridatek/airflow
      tag: "3.2.0"
  # The DAG reads/writes the governed table through Trino (pinned `trino` Service).
  env:
    - name: AIRFLOW_CONN_TRINO_DEFAULT
      value: trino://admin@trino:8080/iceberg
  # LocalExecutor runs tasks in the scheduler — no Celery broker needed.
  redis:
    enabled: false
  # Run the DB migration job as a normal resource, not a Helm hook. With hooks +
  # `--wait`, the scheduler/api-server init containers block on migrations that
  # only run in a post-install hook → deadlock. As a plain job it runs during
  # install so the pods can start. The wait-for-db init container keeps it from
  # racing the bundled Postgres startup into CrashLoopBackOff.
  migrateDatabaseJob:
    useHelmHooks: false
    extraInitContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
          - sh
          - -c
          - "until nc -z airflow-postgresql 5432; do echo 'waiting for db'; sleep 2; done"
  # Airflow 3 defaults to SimpleAuthManager (no DB users), so the legacy
  # create-user job ("airflow users create" is FAB-only) crash-loops. Skip it;
  # the api-server manages its own admin credential.
  createUserJob:
    enabled: false
  # Static dev key so Helm doesn't rotate the webserver secret on every upgrade.
  webserverSecretKey: "odp-dev-airflow-secret"
  # Metadata store is the chart's bundled Postgres (postgresql.enabled, default on).
  # Distinct name so it doesn't collide with Superset's `<release>-postgresql`.
  postgresql:
    fullnameOverride: airflow-postgresql
  data:
    metadataConnection:
      host: airflow-postgresql
  dags:
    gitSync:
      enabled: true
      repo: https://github.com/gridatek/open-data-platform.git
      branch: main
      ref: main
      subPath: platform/engineering/airflow/dags

# ── Shared Ranger credential ─────────────────────────────────
# One Secret (templates/ranger-credentials-secret.yaml) for the Ranger admin
# password (used by Ranger and the console) + the Ranger DB user/password (used
# by the Ranger admin and its Postgres). Override these before using for real.
rangerCredentials:
  create: true
  secretName: odp-ranger-credentials
  adminPassword: "rangerR0cks!"
  dbUser: rangeradmin
  dbPassword: rangeradmin

# ── SDX policies — Apache Ranger + its Postgres (local subchart) ──
# Default ON: the admin image is published to GHCR (publish-images.yml) and the
# chart points at it — make the package public (or add an imagePullSecret) to pull.
# Stable Service names ranger-admin / ranger-db (fullnameOverride) for
# load-policies.sh and the Trino Ranger plugin.
ranger:
  enabled: true
  fullnameOverride: ranger
  # admin password + DB creds come from the shared Secret (keys adminPassword,
  # dbUser, dbPassword).
  credentials:
    existingSecret: odp-ranger-credentials
  db:
    name: ranger

# ── MLflow backend-store credential ──────────────────────────
# One Secret (templates/mlflow-credentials-secret.yaml) for the MLflow Postgres
# password. Override before using for real.
mlflowCredentials:
  create: true
  secretName: odp-mlflow-credentials
  dbPassword: mlflow

# ── Streaming + ML tier (local subcharts) ───────────────────
# Public images, so they "just work" — but default OFF to keep the base install
# lean (like superset/airflow). Enable with --set <name>.enabled=true. Stable
# Service names via fullnameOverride (kafka clients rely on `kafka:9092`).
kafka:
  enabled: false
  fullnameOverride: kafka
nifi:
  enabled: false
  fullnameOverride: nifi
mlflow:
  enabled: false
  fullnameOverride: mlflow
  # S3 artifact creds from the shared Secret; the backend-store Postgres password
  # from the mlflow Secret below.
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    bucket: mlflow
    existingSecret: odp-s3-credentials
  db:
    existingSecret: odp-mlflow-credentials
# JupyterHub (≈ CML notebooks). Image published to GHCR; default on.
jupyterhub:
  enabled: true
  fullnameOverride: jupyterhub

# ── Control plane — console API (local subchart) ─────────────
# Default ON: image published to GHCR (make the package public to pull). Only the
# API is containerized; the Angular web is the console-web subchart below.
console:
  enabled: true
  fullnameOverride: console-api
  # The Ranger admin password it uses to call the Ranger API comes from the
  # shared Secret (key adminPassword), same as the ranger subchart.
  endpoints:
    ranger:
      existingSecret: odp-ranger-credentials

# ── Control plane — console web UI (Angular + nginx, local subchart) ──
# Default ON: image published to GHCR. Needs the console API (nginx proxies
# /api → console-api:8090), which is also on by default above.
console-web:
  enabled: true
  fullnameOverride: console-web
  apiUpstream: console-api:8090

# ── Operational DB — HBase + Phoenix (local subchart) ────────
# Public image, default off (heavy; standalone, not tied to the lakehouse).
# Phoenix Query Server reachable at opdb:8765.
opdb:
  enabled: false
  fullnameOverride: opdb
